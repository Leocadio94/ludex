name: Release Flow Launcher plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read plugin version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content src/FlowLauncher/plugin.json | ConvertFrom-Json).Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match plugin.json Version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/FlowLauncher/Flow.Launcher.Plugin.Ludex.csproj -c Release -o publish

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "Flow.Launcher.Plugin.Ludex-${{ steps.meta.outputs.version }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: Flow.Launcher.Plugin.Ludex-*.zip
          generate_release_notes: true
          make_latest: true
