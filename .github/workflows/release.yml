name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read plugin version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json | ConvertFrom-Json).Version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish Flow.Launcher.Plugin.GameSavesManager.csproj -c Release -o publish

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "Flow.Launcher.Plugin.GameSavesManager-${{ steps.meta.outputs.version }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: Flow.Launcher.Plugin.GameSavesManager-*.zip
          generate_release_notes: true
